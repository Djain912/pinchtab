<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accessibility Violations Fixture</title>
  <style>
    .low-contrast { color: #aaaaaa; background: #ffffff; }
  </style>
</head>
<body>
  <h1>Accessibility violations fixture</h1>

  <!-- image-alt: an image with no alt text -->
  <img id="no-alt" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">

  <!-- label: a text input with no associated label -->
  <form>
    <input id="email" type="text" name="email">
  </form>

  <!-- color-contrast: grey-on-white text below the AA ratio -->
  <p class="low-contrast">This paragraph is low contrast and fails WCAG AA.</p>

  <!-- duplicate-id-aria: an id referenced by ARIA is used on two elements -->
  <input type="text" aria-labelledby="dup">
  <span id="dup">first label</span>
  <span id="dup">second label</span>

  <!-- an iframe with its own missing-alt image, audited by axe's frame support -->
  <iframe title="child frame" srcdoc='<!doctype html><html lang="en"><body><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></body></html>'></iframe>
</body>
</html>
